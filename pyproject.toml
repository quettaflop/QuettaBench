[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "quettabench"
version = "0.1.0"
description = "LLM serving benchmark and QuettaServe-vs-vLLM cross-validator"
requires-python = ">=3.10"
# requirements.txt, kept in step by hand; probes add requirements-probe.txt.
dependencies = [
    "aiohttp>=3.9",
    "numpy>=1.24",
    "datasets>=2.18",
    "transformers>=4.40",
    "pyyaml>=6",
    "huggingface_hub>=0.25",
]

[project.optional-dependencies]
# shellcheck: actionlint lints workflow run steps with it when it is on PATH, as on CI runners.
dev = ["pre-commit", "shellcheck-py"]

[project.scripts]
qbench = "quettabench.cli:main"

# Only the package installs: data/ and tests/ are not
# importable names to put on site-packages next to the stdlib.
[tool.setuptools.packages.find]
include = ["quettabench*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, pyupgrade. Not B: its loop-closure
# and zip(strict=) findings are deliberate in the timing loops, and
# strict= would change behaviour.
select = ["E", "F", "I", "UP"]
# Line length is not enforced; the moved code has lines up to 160.
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Timing lambdas close over tensors the probe then `del`s to free GPU
# memory; pyflakes reads the del as making the name undefined.
"quettabench/probes/{cross_attn,flash_attn,gemm,moe,reparallel}.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
