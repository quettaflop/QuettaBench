[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "quettabench"
version = "0.1.0"
description = "LLM serving benchmark and QuettaServe-vs-vLLM comparison"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "numpy>=1.24",
    "datasets>=2.18",
    "transformers>=4.40",  # ShareGPT tokenizers and the reference driver
    "pyyaml>=6",
    "huggingface_hub>=0.25",  # first release with HFValidationError and LocalEntryNotFoundError
]

[project.optional-dependencies]
# shellcheck: actionlint lints workflow run steps with it when on PATH.
dev = ["pre-commit", "shellcheck-py"]
# Pin torch and vllm to the serving stack's versions: probes time vLLM's own kernels.
probe = ["torch>=2.1", "vllm>=0.6"]

[project.scripts]
qbench = "quettabench.cli:main"

# Only the package installs; data/ and tests/ must not land in site-packages.
[tool.setuptools.packages.find]
include = ["quettabench*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Not B: its loop-closure and zip(strict=) findings are deliberate in the timing loops.
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Timing lambdas close over tensors the probe then `del`s; pyflakes reads that as undefined.
"quettabench/probes/{chunked_prefill_attn,flash_attn,gemm,moe,reparallel}.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["quettabench"]
check_untyped_defs = true

# Not installed in the mypy hook env: the serving stack, and the QuettaSim and engine modules loaded by name.
[[tool.mypy.overrides]]
module = [
    "torch.*", "vllm.*", "triton.*", "transformers.*", "datasets.*", "safetensors.*", "flashinfer.*", "nixl.*",
    "engine.*", "simulator.*", "kernel_composed.*",
]
ignore_missing_imports = true
