name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          # No version matrix: on 3.10 (numpy 2.2) a golden drifts in the last float bit.
          python-version: "3.12"
          cache: pip
      - run: pip install -e . pytest
      - run: python -m pytest tests -q
