name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  check-format:
    name: Check format
    # Same rule as the commit-msg hook: '<area>: <change>', at most 72 chars.
    if: github.event.action != 'edited' || github.event.changes.title != null
    runs-on: ubuntu-latest
    steps:
      - name: Validate title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^[a-z][a-z0-9_./-]*: [^[:space:]].*$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title must be '<area>: <change>' with a lowercase area."
            exit 1
          fi
          if (( ${#PR_TITLE} > 72 )); then
            echo "::error::PR title is ${#PR_TITLE} chars; the limit is 72."
            exit 1
          fi
