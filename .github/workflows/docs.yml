name: docs

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r docs/requirements.txt
      - run: sphinx-apidoc -f --separate --module-first -o docs/api src
      - run: sphinx-build -b html docs docs/_build/html
      - uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DOCS_DEPLOY_TOKEN }}
          external_repository: lynae-1219/quettabench-docs-preview
          publish_branch: main
          publish_dir: docs/_build/html
