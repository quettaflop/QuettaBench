name: bench-dispatch

# A push to main that touches configs/runs/*.yaml publishes the qbench run
# command for each changed yaml as an artifact. No job runs them: a run needs
# engine.model, a weights path that only a GPU host knows.

on:
  push:
    branches: [main]
    paths: [configs/runs/*.yaml]

jobs:
  checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- 'configs/runs/*.yaml' > changed.txt
          sed 's#^#python3 -m quettabench.cli run #; s#$# --set engine.model=<weights>#' changed.txt > checklist.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-checklist
          path: checklist.txt
