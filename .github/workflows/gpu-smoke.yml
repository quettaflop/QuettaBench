name: gpu-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-smoke:
    # Needs a self-hosted runner registered on a GPU host whose default
    # python has torch, vllm and pytest (the serving env). Hosted runners
    # have no GPU; there the same files skip inside the regular tests job.
    # The crossval smoke also needs MODEL set to a Llama weights dir.
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: python -m pytest tests/contracts/test_probes_gpu.py -v
