name: gpu-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-smoke:
    # Needs a self-hosted runner registered on a GPU host whose default
    # python has torch, vllm and pytest (the serving env). Hosted runners
    # have no GPU; there the same file skips inside the regular tests job.
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: python -m pytest profiling/tests/test_probe_smoke_gpu.py -v
