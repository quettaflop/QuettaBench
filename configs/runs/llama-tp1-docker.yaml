# llama-tp1 with the server in a container: the RTX PRO 6000 nodes have vLLM
# only as docker images (vllm/vllm-openai:v0.26.0, the base the qbench image is built and tested on).
model: llama31_8b
engine:
  tp: 1
  driver: http
  image: vllm/vllm-openai:v0.26.0
workload:
  kind: grid
mode:
  mode: serve
  grid: llama_single
hardware:
  launcher: docker
