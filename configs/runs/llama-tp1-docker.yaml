# llama-tp1 with the server in a container, for hosts that have vLLM only as a docker image (vllm/vllm-openai:v0.26.0, the base the qbench image is built and tested on).
model: llama31_8b
engine:
  tp: 1
  image: vllm/vllm-openai:v0.26.0
workload:
  kind: grid
mode:
  mode: serve
  grid: llama_single
hardware:
  launcher: docker
