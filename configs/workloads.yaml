# Keys are WorkloadProfile's fields; omitted keys take its defaults.

chat-singleturn:
  # Chat-sized caps, safe for 4K-context cells.
  isl_tokens: 2048
  osl_tokens: 1024
  dataset: sharegpt
  prefix_caching_required: true

coding-singleturn:
  # The JSONL sets token lengths and the system prompt; isl/osl are caps.
  isl_tokens: 17000
  osl_tokens: 800
  dataset: jsonl
  file_path: data/coding_agent_prompts.jsonl
  system_prompt: ''
  prefix_caching_required: true

mooncake-trace:
  # Tokens expand from hash_ids so prefix sharing survives replay; needs completions.
  isl_tokens: 131072
  osl_tokens: 4096
  dataset: mooncake-trace
  file_path: data/mooncake/conversation_trace.jsonl
  system_prompt: ''
  prefix_caching_required: true

chat-multiturn-short:
  isl_tokens: 8192
  osl_tokens: 1000
  dataset: sharegpt-multi-turn
  mode: multi-turn
  prefix_caching_required: true
  min_turns: 3
  max_turns: 5
  active: false

swebench-multiturn-short:
  # Turns are agent steps, not conversation rounds.
  isl_tokens: 32768
  osl_tokens: 2000
  dataset: swebench-multi-turn
  file_path: data/swebench_trajectories.jsonl
  system_prompt: ''
  mode: multi-turn
  prefix_caching_required: true
  min_turns: 13
  max_turns: 30
  num_sessions: 100
  active: false

