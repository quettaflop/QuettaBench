# Keys are WorkloadProfile's fields; omitted keys take its defaults.
# A session is cut at the first turn whose recorded prompt_tokens passes isl_tokens; agent files carry the counts the
# serving engine reported for every turn, never an estimate.

chat-singleturn:
  # Chat-sized caps, safe for 4K-context cells.
  isl_tokens: 2048
  osl_tokens: 1024
  dataset: sharegpt
  prefix_caching_required: true

coding-singleturn:
  # The JSONL sets token lengths and the system prompt; isl/osl are caps.
  isl_tokens: 17000
  osl_tokens: 800
  dataset: jsonl
  file_path: data/coding_agent_prompts.jsonl
  system_prompt: ''
  prefix_caching_required: true

mooncake-trace:
  # Tokens expand from hash_ids so prefix sharing survives replay; needs completions.
  isl_tokens: 131072
  osl_tokens: 4096
  dataset: mooncake-trace
  file_path: data/mooncake/conversation_trace.jsonl
  system_prompt: ''
  prefix_caching_required: true

chat-multiturn-short:
  isl_tokens: 8192
  osl_tokens: 1000
  dataset: sharegpt-multi-turn
  mode: multi-turn
  prefix_caching_required: true
  min_turns: 3
  max_turns: 5
  active: false

swebench-qwen-multiturn-medium:
  # Turns are agent steps, not conversation rounds. An agent profile replays every eligible session; num_sessions
  # would take the first N of a seeded shuffle, the same N at every concurrency.
  # Qwen3.8-Flash-Next mini-swe-agent runs on SWE-bench Verified (2026-09-10), each step with the prompt_tokens and
  # completion_tokens the server reported (data/build_trajectories.py swebench-native). Sessions of 30+ steps, the
  # first 49 steps.
  <<: &agent {system_prompt: '', mode: multi-turn, prefix_caching_required: true, active: false}
  isl_tokens: 65536
  osl_tokens: 8192
  dataset: swebench-multi-turn
  file_path: data/swebench_native_trajectories.jsonl
  min_turns: 30
  max_turns: 49

swebench-qwen-multiturn-long:
  # The same runs, sessions of 50+ steps in full; the longest is 78, where the agent's 49K context ends it.
  <<: *agent
  isl_tokens: 65536
  osl_tokens: 8192
  dataset: swebench-multi-turn
  file_path: data/swebench_native_trajectories.jsonl
  min_turns: 50
  max_turns: 80

terminalbench-qwen-multiturn-medium:
  # Qwen3.8-Flash-Next terminus-2 runs on Terminal-Bench 2.1 (Harbor, 2026-08-27), each step with the counts the
  # server reported (data/build_trajectories.py terminalbench-atif). Sessions of 20+ steps, the first 39 steps.
  <<: *agent
  isl_tokens: 131072
  osl_tokens: 49152
  dataset: terminalbench-multi-turn
  file_path: data/terminalbench_qwen_trajectories.jsonl
  min_turns: 20
  max_turns: 39

terminalbench-qwen-multiturn-long:
  # The same runs, sessions of 40+ steps in full; the longest is 83.
  <<: *agent
  isl_tokens: 131072
  osl_tokens: 49152
  dataset: terminalbench-multi-turn
  file_path: data/terminalbench_qwen_trajectories.jsonl
  min_turns: 40
  max_turns: 100

deepresearch-multiturn:
  # Built by data/build_trajectories.py deepresearch. The cap is the trace's 65536 reasoning budget, so no recorded
  # output cuts a session; a session is cut only where a prompt no longer fits beside its output.
  <<: *agent
  isl_tokens: 131072
  osl_tokens: 65536
  dataset: deepresearch-multi-turn
  file_path: data/deepresearch_trajectories.jsonl
  min_turns: 1
  max_turns: 30

deepsearch-multiturn:
  # Built by data/build_trajectories.py deepsearch from the DeepSearchQA trace; the same session shape as deepresearch.
  <<: *agent
  isl_tokens: 131072
  osl_tokens: 65536
  dataset: deepresearch-multi-turn
  file_path: data/deepsearch_trajectories.jsonl
  min_turns: 1
  max_turns: 30

test:
  isl_tokens: 10
  osl_tokens: 20
  dataset: test
  active: false
