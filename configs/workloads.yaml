# Workload profiles by name; keys are WorkloadProfile's fields and omitted keys take its defaults.

chat-singleturn:
  # Caps are natural-chat sized so the profile is safe for 4K-context cells.
  isl_tokens: 2048
  osl_tokens: 1024
  isl_stddev: 0.15
  description: Canonical natural ShareGPT single-turn chat (not a long-context prefill stress workload)
  dataset: sharegpt
  prefix_caching_required: true
  agent_type: chat
  data_source: sharegpt

coding-singleturn:
  # The JSONL drives token lengths and embeds the system prompt; isl/osl are caps.
  isl_tokens: 17000
  osl_tokens: 800
  isl_stddev: 0.0
  description: Real coding single-turn prompts captured from SWE-Bench-style planning calls
  dataset: jsonl
  file_path: data/coding_agent_prompts.jsonl
  system_prompt: ''
  prefix_caching_required: true
  agent_type: coding
  data_source: swebench

mooncake-trace:
  # Tokens expand from hash_ids so prefix sharing survives replay; needs a completions backend.
  isl_tokens: 131072
  osl_tokens: 4096
  isl_stddev: 0.0
  description: Mooncake production trace replay with exact prefix sharing from hash_ids
  dataset: mooncake-trace
  file_path: data/mooncake/conversation_trace.jsonl
  system_prompt: ''
  prefix_caching_required: true
  agent_type: chat
  data_source: mooncake

chat-multiturn-short:
  isl_tokens: 8192
  osl_tokens: 1000
  isl_stddev: 0.0
  description: 'Natural ShareGPT multi-turn chat: 3-5 turns. Short/medium/long denote turn depth, not monotonic ISL or OSL.'
  dataset: sharegpt-multi-turn
  mode: multi-turn
  prefix_caching_required: true
  min_turns: 3
  max_turns: 5
  agent_type: chat
  turn_style: multi-turn
  data_source: sharegpt
  active: false

swebench-multiturn-short:
  # Turns are agent steps (tool calls), not conversation rounds.
  isl_tokens: 32768
  osl_tokens: 2000
  isl_stddev: 0.0
  description: 'Real SWEBench coding agent: 13-30 step sessions (shortest available)'
  dataset: swebench-multi-turn
  file_path: data/swebench_trajectories.jsonl
  system_prompt: ''
  mode: multi-turn
  prefix_caching_required: true
  min_turns: 13
  max_turns: 30
  num_sessions: 100
  agent_type: coding
  turn_style: multi-turn
  data_source: swebench
  active: false

test:
  isl_tokens: 10
  osl_tokens: 20
  isl_stddev: 0.0
  description: Quick smoke test
  dataset: test
  agent_type: chat
  data_source: test
  active: false
