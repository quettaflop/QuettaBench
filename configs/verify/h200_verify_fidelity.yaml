# H200 verification, G5: the corrected agent files (native SWE-bench requests with the bash tool schema, Terminal-bench
# with terminus-2's JSON reply) at 8 agents, to check the server counts the prompt tokens the traces recorded.
# Engine block as configs/verify/h200_verify_sessions.yaml. Export VLLM_PLE_CPU_OFFLOAD=1 VLLM_ALLOW_LONG_MAX_MODEL_LEN=1.
model: qwen38_flash_next
engine:
  model: Qwen/Qwen3.8-Flash-Next
  dtype: auto
  tp: 1
  ep: true
  gpu_util: 0.85
  max_model_len: 1000000
  prefix_caching: true
  extra:
    vllm:
      max_num_seqs: 256
      moe_backend: triton
      no_enable_flashinfer_autotune: true
      data_parallel_size: 8
      enable_auto_tool_choice: true
      tool_call_parser: qwen3_coder
      reasoning_parser: qwen3
      speculative_config: '{"method":"mtp","num_speculative_tokens":3}'
      language_model_only: true
      hf_overrides: '{"text_config": {"rope_parameters": {"mrope_interleaved": true, "mrope_section": [11, 11, 10], "rope_type": "yarn", "rope_theta": 10000000, "partial_rotary_factor": 0.25, "factor":
        4.0, "original_max_position_embeddings": 262144}}}'
      enable_prompt_tokens_details: true
workload:
  kind: sessions
  use_recorded_waits: true  # an agent waits as long as it did while its tools ran
mode:
  mode: serve
  load: closed
  warmup: 0
  reset_prefix_cache: true
  exact_output_length: true
  temperature: 0.0
  timeout: 10000  # Terminal-bench turns run to 49152 tokens: 9830 s at 200 ms a token
hardware:
  link_profile: nvlink
  visible_devices: 0,1,2,3,4,5,6,7
  ready_timeout_s: 10800
matrix:
  workload.source:
  - swebench-qwen-multiturn-medium
  - terminalbench-qwen-multiturn-medium
  mode.concurrency:
  - 8
