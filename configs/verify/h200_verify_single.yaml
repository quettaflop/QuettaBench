# H200 single-turn timing: qbench against another harness on the same 200 coding prompts, each on a fresh
# Qwen3.8-27B TP1 server.
model: qwen38_27b
engine:
  model: Qwen/Qwen3.8-27B
  tp: 1
  prefix_caching: true
  extra:
    vllm:
      enable_prompt_tokens_details: true
workload:
  kind: live
  source: coding-singleturn
  num_requests: 200
mode:
  mode: serve
  load: closed
  concurrency: 16
  warmup: 0
  reset_prefix_cache: true
  exact_output_length: true
  temperature: 0.0
  timeout: 3600
hardware:
  visible_devices: '0'
  ready_timeout_s: 3600
