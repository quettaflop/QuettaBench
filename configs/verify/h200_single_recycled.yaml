# H200 cloned-trajectory bias: a 5-minute recycled SWE-bench replay at 8 agents on an attached Qwen3.8-27B TP1
# server, salted and then unsalted; turns capped at index 14 so every prompt fits 40960 tokens.
model: qwen38_27b
engine:
  model: Qwen/Qwen3.8-27B
  tp: 1
  prefix_caching: true
  port: 18801
  extra:
    vllm:
      enable_prompt_tokens_details: true
workload:
  kind: sessions
  source: swebench-qwen-multiturn-medium
  use_recorded_waits: true
  stratified: true
  max_turn_index: 14
mode:
  mode: serve
  load: closed
  concurrency: 8
  duration_s: 300
  warmup: 0
  reset_prefix_cache: true
  exact_output_length: true
  temperature: 0.0
  timeout: 3600
hardware:
  visible_devices: '0'
  launcher: attach
