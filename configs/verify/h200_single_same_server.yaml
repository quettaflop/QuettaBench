# H200 single-turn same-server A/B: qbench and another harness, alternating, send the same 200 coding prompts at 16
# concurrent as token ids on /v1/completions to one attached Qwen3.8-27B TP1 server.
model: qwen38_27b
engine:
  model: Qwen/Qwen3.8-27B
  tp: 1
  prefix_caching: true
  port: 18801
  extra:
    vllm:
      enable_prompt_tokens_details: true
workload:
  kind: live
mode:
  mode: serve
  load: closed
  concurrency: 16
  warmup: 0
  reset_prefix_cache: true
  exact_output_length: true
  temperature: 0.0
  timeout: 3600
hardware:
  visible_devices: '0'
  launcher: attach
