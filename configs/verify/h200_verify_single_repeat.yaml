# H200 verification, G1b: configs/verify/h200_verify_single.yaml twice on one server, to measure run-to-run spread.
# mode.timeout only gives the two points distinct run names; no request reaches it.
model: qwen38_27b
engine:
  model: Qwen/Qwen3.8-27B
  tp: 1
  prefix_caching: true
  extra:
    vllm:
      enable_prompt_tokens_details: true
workload:
  kind: live
  source: coding-singleturn
  num_requests: 200
mode:
  mode: serve
  load: closed
  concurrency: 16
  warmup: 0
  reset_prefix_cache: true
  exact_output_length: true
  temperature: 0.0
hardware:
  visible_devices: '0'
  ready_timeout_s: 3600
matrix:
  mode.timeout:
  - 3600
  - 3601
