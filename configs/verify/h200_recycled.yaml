# H200 verification of fix/session-replay: the recycled replay (mode.duration_s) on a stratified SWE-bench sample,
# against SemiAnalysis AgentX on the same server. The engine block is InferenceX's vLLM H200 TP8 DeepSeek V4.1 Flash
# config as /workspace/qb-verify/g4.sh runs it, plus --enable-prompt-tokens-details; the capture size goes with the
# lane as InferenceX's agentic.yaml sets it. A fresh server per point (no --reuse-server), as InferenceX requires.
model: deepseek_v41_flash
engine:
  model: deepseek-ai/DeepSeek-V4.1-Flash
  env:  # g4.sh's exports
    VLLM_USE_RUST_FRONTEND: 1
    VLLM_ENGINE_READY_TIMEOUT_S: 7200
    PYTHONUNBUFFERED: 1
  tp: 8
  ep: false  # InferenceX's TP8 lanes run without expert parallel
  max_model_len: 1048576
  # The adapter always passes these three; g4.sh passes none, so they carry vLLM 0.31.0's defaults.
  dtype: auto
  gpu_util: 0.92
  prefix_caching: true
  port: 18920
  extra:
    vllm:
      served_model_name: deepseek-ai/DeepSeek-V4.1-Flash
      language_model_only: true
      tokenizer_mode: deepseek_v41
      tool_call_parser: deepseek_v41
      enable_auto_tool_choice: true
      reasoning_parser: deepseek_v41
      engram_config: '{"cpu_offload":true}'
      speculative_config: '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
      safetensors_load_strategy: prefetch
      disable_uvicorn_access_log: true
      enable_prompt_tokens_details: true
workload:
  kind: sessions
  use_recorded_waits: true  # an agent waits as long as it did while its tools ran
  stratified: true
mode:
  mode: serve
  load: closed
  duration_s: 1800
  warmup: 0
  reset_prefix_cache: true
  exact_output_length: true
  timeout: 3600
hardware:
  link_profile: nvlink
  visible_devices: 0,1,2,3,4,5,6,7
  ready_timeout_s: 10800
matrix:
  workload.source:
  - swebench-qwen-multiturn-medium
  mode.concurrency+engine.extra.vllm.max_cudagraph_capture_size:
  - [8, 64]
  - [32, 256]
  - [128, 1024]
  - [256, 2048]
